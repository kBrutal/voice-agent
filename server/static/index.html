<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            color: #eee;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00d4ff, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .status-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .status-row:last-child {
            margin-bottom: 0;
        }
        
        .status-label {
            font-size: 0.875rem;
            color: #888;
            min-width: 100px;
        }
        
        .status-value {
            flex: 1;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.875rem;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
            transition: all 0.3s ease;
        }
        
        .status-indicator.active {
            background: #00d4ff;
            box-shadow: 0 0 10px #00d4ff;
        }
        
        .status-indicator.recording {
            background: #ff6b6b;
            box-shadow: 0 0 10px #ff6b6b;
            animation: pulse 1s infinite;
        }
        
        .status-indicator.processing {
            background: #ffd93d;
            box-shadow: 0 0 10px #ffd93d;
        }
        
        .status-indicator.speaking {
            background: #6bcb77;
            box-shadow: 0 0 10px #6bcb77;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #000;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #ffd93d, #f5c62e);
            color: #000;
        }
        
        .btn-warning:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 217, 61, 0.4);
        }
        
        .transcript-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
            min-height: 100px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .transcript-box.empty {
            color: #666;
            font-style: italic;
        }
        
        .transcript-label {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .audio-visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 60px;
            margin: 1rem 0;
        }
        
        .audio-bar {
            width: 6px;
            background: linear-gradient(180deg, #00d4ff, #ff6b6b);
            border-radius: 3px;
            transition: height 0.1s ease;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .controls .btn {
            flex: 1;
        }
        
        .settings {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #888;
        }
        
        .setting-item select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 0.5rem;
            color: #eee;
            font-family: inherit;
        }
        
        .error-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 107, 107, 0.9);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .error-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voice Assistant</h1>
        
        <div class="status-card">
            <div class="status-row">
                <span class="status-label">Connection</span>
                <span class="status-value">WebSocket</span>
                <div class="status-indicator" id="connStatus"></div>
            </div>
            <div class="status-row">
                <span class="status-label">State</span>
                <span class="status-value" id="stateValue">Idle</span>
                <div class="status-indicator" id="stateStatus"></div>
            </div>
        </div>
        
        <div class="audio-visualizer" id="visualizer">
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
            <div class="audio-bar" style="height: 4px;"></div>
        </div>
        
        <div class="transcript-box empty" id="transcriptBox">
            Press record and speak...
        </div>
        
        <div class="transcript-box empty" id="responseBox">
            Response will appear here...
        </div>
        
        <button class="btn btn-primary" id="recordBtn" onclick="toggleRecording()">
            <span id="btnText">Start Recording</span>
        </button>
        
        <div class="controls">
            <button class="btn btn-danger" id="stopBtn" onclick="stopRecording()" disabled>
                Stop
            </button>
            <button class="btn btn-warning" id="interruptBtn" onclick="interrupt()" disabled>
                Interrupt
            </button>
            <button class="btn" id="clearBtn" onclick="clearTranscript()" style="background: rgba(255,255,255,0.1); color: #eee;">
                Clear
            </button>
        </div>
        
        <div class="settings">
            <div class="setting-item">
                <label for="voiceSelect">Voice:</label>
                <select id="voiceSelect">
                    <option value="default">Default</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                </select>
            </div>
        </div>
    </div>
    
    <div class="error-toast" id="errorToast"></div>
    
    <script>
        // Configuration
        const CHUNK_DURATION = 100; // ms
        
        // State
        let ws = null;
        let sessionId = generateSessionId();
        let mediaRecorder = null;
        let audioContext = null;
        let analyser = null;
        let source = null;
        let animationId = null;
        let isRecording = false;
        let audioChunks = [];
        let responseAudioParts = [];
        let reconnectTimer = null;
        
        // DOM Elements
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const btnText = document.getElementById('btnText');
        const connStatus = document.getElementById('connStatus');
        const stateStatus = document.getElementById('stateStatus');
        const stateValue = document.getElementById('stateValue');
        const transcriptBox = document.getElementById('transcriptBox');
        const responseBox = document.getElementById('responseBox');
        const visualizer = document.getElementById('visualizer');
        const errorToast = document.getElementById('errorToast');
        
        // Generate session ID
        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        // Show error toast
        function showError(message) {
            errorToast.textContent = message;
            errorToast.classList.add('show');
            setTimeout(() => errorToast.classList.remove('show'), 5000);
        }
        
        // Update connection status
        function setConnectionStatus(connected) {
            connStatus.classList.toggle('active', connected);
        }
        
        // Update recording/processing state
        function setState(state) {
            stateStatus.className = 'status-indicator';
            stateValue.textContent = state.charAt(0).toUpperCase() + state.slice(1);
            
            if (state === 'recording') {
                stateStatus.classList.add('recording');
            } else if (state === 'processing') {
                stateStatus.classList.add('processing');
            } else if (state === 'speaking') {
                stateStatus.classList.add('speaking');
            } else {
                stateStatus.classList.remove('recording', 'processing', 'speaking');
            }
        }
        
        // Persistent state across reconnections
        let isWaitingForResponse = false;
        
        // Initialize WebSocket
        function initWebSocket() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            sessionId = generateSessionId();
            const socket = new WebSocket(`ws://${location.host}/ws/${sessionId}`);
            ws = socket;
            
            socket.onopen = () => {
                if (ws !== socket) return;
                console.log('WebSocket connected');
                setConnectionStatus(true);
                if (!isWaitingForResponse) {
                    setState('idle');
                }
                
                socket.send(JSON.stringify({
                    type: 'config',
                    sample_rate: 16000,
                    channels: 1
                }));
            };
        
            socket.onclose = () => {
                if (ws !== socket) return;
                console.log('WebSocket disconnected');
                setConnectionStatus(false);
                setState('disconnected');

                if (isRecording) {
                    return;
                }

                isWaitingForResponse = false;
                reconnectTimer = setTimeout(initWebSocket, 1500);
            };
            
            socket.onerror = (error) => {
                if (ws !== socket) return;
                console.error('WebSocket error:', error);
                showError('Connection error');
            };
            
            socket.onmessage = (event) => {
                if (ws !== socket) return;
                const message = JSON.parse(event.data);
                handleMessage(message);
            };
        }
        
        // Handle incoming messages
        function handleMessage(message) {
            switch (message.type) {
                case 'transcript':
                    transcriptBox.textContent = message.text;
                    transcriptBox.classList.remove('empty');
                    break;
                    
                case 'response_text':
                    responseBox.textContent = message.text;
                    responseBox.classList.remove('empty');
                    break;
                    
                case 'audio_chunk':
                    responseAudioParts.push(base64ToBytes(message.data));
                    break;
                    
                case 'audio_end':
                    playCompleteWav(responseAudioParts);
                    responseAudioParts = [];
                    isWaitingForResponse = false;
                    // Don't disable interruptBtn here - playCompleteWav handles it
                    break;
                    
                case 'status':
                    const statusMsg = message.message.toLowerCase().replace(' ', '_');
                    setState(statusMsg);
                    // Set waiting flag when processing starts
                    if (statusMsg.includes('process') || statusMsg.includes('generat') || statusMsg.includes('synthes') || statusMsg.includes('stream')) {
                        isWaitingForResponse = true;
                        interruptBtn.disabled = false;
                    }
                    break;
                    
                case 'error':
                    showError(message.message);
                    setState('error');
                    isWaitingForResponse = false;
                    setTimeout(() => setState('idle'), 2000);
                    break;
                    
                case 'ping':
                    break;
            }
        }

        function base64ToBytes(base64Data) {
            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
        }

        let currentAudio = null;

        async function playCompleteWav(parts) {
            if (!parts.length) {
                setState('idle');
                return;
            }

            const total = parts.reduce((n, part) => n + part.length, 0);
            const merged = new Uint8Array(total);
            let offset = 0;
            for (const part of parts) {
                merged.set(part, offset);
                offset += part.length;
            }

            const blob = new Blob([merged], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            currentAudio = new Audio(url);
            setState('speaking');
            interruptBtn.disabled = false;  // Enable interrupt during playback

            try {
                await currentAudio.play();
                await new Promise((resolve, reject) => {
                    currentAudio.onended = resolve;
                    currentAudio.onerror = () => reject(new Error('Audio playback failed'));
                });
            } catch (e) {
                console.error('Audio play error:', e);
                showError('Could not play audio');
            } finally {
                URL.revokeObjectURL(url);
                currentAudio = null;
                interruptBtn.disabled = true;
                setState('idle');
            }
        }
        
        // Visualizer
        function startVisualizer() {
            const bars = visualizer.querySelectorAll('.audio-bar');
            
            function animate() {
                if (!analyser) return;
                
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);
                
                bars.forEach((bar, i) => {
                    const value = dataArray[i * 2] || 0;
                    const height = Math.max(4, (value / 255) * 50);
                    bar.style.height = `${height}px`;
                });
                
                animationId = requestAnimationFrame(animate);
            }
            
            animate();
        }
        
        function stopVisualizer() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            const bars = visualizer.querySelectorAll('.audio-bar');
            bars.forEach(bar => bar.style.height = '4px');
        }
        
        // Start recording
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                // Setup audio context for visualization
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                // Setup MediaRecorder
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm;codecs=opus'
                });
                
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    if (!audioChunks.length || !ws || ws.readyState !== WebSocket.OPEN) {
                        showError('Connection lost before audio could be sent');
                        isWaitingForResponse = false;
                        return;
                    }
                    const blob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
                    try {
                        await sendAudioBlob(blob);
                    } catch (e) {
                        console.error('Failed to send audio:', e);
                        showError('Failed to send audio');
                        isWaitingForResponse = false;
                    }
                };
                
                mediaRecorder.start(CHUNK_DURATION);
                isRecording = true;
                
                recordBtn.disabled = true;
                stopBtn.disabled = false;
                interruptBtn.disabled = false;
                btnText.textContent = 'Recording...';
                setState('recording');
                startVisualizer();
                
            } catch (err) {
                console.error('Recording error:', err);
                showError('Microphone access denied');
            }
        }
        
        function sendAudioBlob(blob) {
            return new Promise((resolve, reject) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    reject(new Error('WebSocket closed'));
                    return;
                }

                const reader = new FileReader();
                reader.onloadend = () => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) {
                        reject(new Error('WebSocket closed'));
                        return;
                    }
                    ws.send(JSON.stringify({
                        type: 'audio_chunk',
                        data: reader.result.split(',')[1]
                    }));
                    ws.send(JSON.stringify({ type: 'audio_end' }));
                    resolve();
                };
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(blob);
            });
        }
        
        // Stop recording
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            if (source) {
                source.disconnect();
            }
            if (audioContext) {
                audioContext.close();
            }
            
            isRecording = false;
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            interruptBtn.disabled = true;
            btnText.textContent = 'Start Recording';
            setState('processing');
            isWaitingForResponse = true;  // Set immediately to prevent reconnection
            stopVisualizer();
        }
        
        // Interrupt - stop everything immediately
        function interrupt() {
            console.log('Interrupt requested');
            
            // Stop recording if active
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            // Stop current audio playback
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            // Stop audio playback
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
            audioQueue.length = 0;
            isPlaying = false;
            
            // Stop visualizer
            stopVisualizer();
            
            // Clean up audio contexts
            if (source) {
                source.disconnect();
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (analyser) {
                analyser = null;
            }
            
            // Send interrupt to server
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'interrupt' }));
            }
            
            // Reset state
            isRecording = false;
            isWaitingForResponse = false;
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            interruptBtn.disabled = true;
            btnText.textContent = 'Start Recording';
            setState('idle');
            
            // Clear transcript boxes
            transcriptBox.textContent = 'Interrupted. Press record to start again...';
            transcriptBox.classList.add('empty');
            responseBox.textContent = 'Response will appear here...';
            responseBox.classList.add('empty');
        }
        
        // Toggle recording
        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        // Clear transcript
        function clearTranscript() {
            transcriptBox.textContent = 'Press record and speak...';
            transcriptBox.classList.add('empty');
            responseBox.textContent = 'Response will appear here...';
            responseBox.classList.add('empty');
        }
        
        // Initialize
        initWebSocket();
        
        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
            if (mediaRecorder) mediaRecorder.stop();
            if (audioContext) audioContext.close();
        });
    </script>
</body>
</html>
