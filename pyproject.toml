[project]
name = "va"
version = "0.1.0"
description = "Voice Assistant: ASR -> LLM -> TTS pipeline with web client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3",
    "dotenv>=0.9.9",
    "openai>=2.54.0",
    "pipecat-ai[cartesia,deepgram,openai,silero,webrtc]>=0.0.108",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=13.0",
    "motor>=3.3",
    "pymongo>=4.6",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
client = [
    "pyaudio>=0.2.14",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "client*"]
exclude = ["Stuff*", "output*", "models*", "samples*", "*.pyc", "__pycache__*"]

[tool.setuptools.package-dir]
"server" = "server"
"client" = "client"
